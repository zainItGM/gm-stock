<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GM Stone Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --row:#F7F7F4; --ink:#1B1F1D; --muted:#5B6662; --line:#D6D8D2;
  --accent:#B0813F; --accent-soft:#F4ECDD; --accent-ink:#1B1F1D;
  --nav:#1B1F1D; --nav-fg:#EDEDE8; --nav-dim:#8E9A93;
  --ok:#3E7A52; --ok-soft:#E6F0E8; --warn:#8A6A2F; --warn-soft:#F4ECDD; --bad:#8C4A45; --bad-soft:#FCF6F5;
  --d:'Barlow Condensed',system-ui,sans-serif; --b:'Inter',system-ui,sans-serif; --m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#141716; --surface:#1E2220; --row:#232826; --ink:#ECEDE8; --muted:#9BA6A0; --line:#353B39;
  --accent:#D2A35E; --accent-soft:#2E2718; --accent-ink:#141716; --nav:#0F1211; --nav-fg:#EDEDE8; --nav-dim:#7F8A85;
  --ok:#7FBF93; --ok-soft:#1E2F24; --warn:#D6B06A; --warn-soft:#2E2718; --bad:#E08C85; --bad-soft:#33221F; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:76px;resize:vertical}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-family:var(--d);text-wrap:balance}
.mono{font-family:var(--m)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--nav);color:var(--nav-fg)}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;background:var(--bg);color:var(--ink);padding:28px 26px;border-top:3px solid var(--accent)}
.login .brand b{font-size:28px}
.login .brand span{color:var(--accent)}
.login p{margin:0;color:var(--muted);font-size:13px}
.login .err{color:var(--bad);font-size:13px;min-height:1.2em}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-fg);padding:22px 16px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--d);font-weight:700;font-size:24px;letter-spacing:.10em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;color:var(--nav-fg);text-decoration:none;border-left:2px solid transparent;font-weight:500}
.nav a small{font-family:var(--m);font-size:11px;color:var(--nav-dim)}
.nav a.on{border-left-color:var(--accent);background:rgba(255,255,255,.06);color:#fff}
.nav a:hover{background:rgba(255,255,255,.05)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--nav-dim)}
.sidefoot a{color:var(--nav-dim);cursor:pointer;text-decoration:underline}
.sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-fg)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--nav-dim);flex:none}
.sync.ok i{background:#7FBF93}.sync.busy i{background:#D6B06A}.sync.bad i{background:#E08C85}

.main{min-width:0;padding:22px 16px 72px}
.main>.in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.head h1{font-size:30px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--ink);font-family:var(--d);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.amber{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--surface);padding:14px 16px}
.tile i{display:block;font-style:normal;font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tile b{font-family:var(--d);font-size:30px;font-weight:600;line-height:1;letter-spacing:.02em}
.tile b small{font-family:var(--m);font-size:11px;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:0}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border:1px solid var(--line);background:var(--surface);font-family:var(--m);font-size:11.5px;letter-spacing:.03em}
.chip small{color:var(--muted);margin-left:5px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.on small{color:inherit;opacity:.7}

.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 span{font-family:var(--m);font-size:11px;font-weight:400;letter-spacing:.05em;color:var(--muted);text-transform:none}
.tblwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--row);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--row)}
td.r,th.r{text-align:right}
td .name{font-weight:600}
td .sub{color:var(--muted);font-size:12.5px;max-width:42ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:52px;height:40px;object-fit:cover;background:var(--row);border:1px solid var(--line);display:block}
.thumb.none{display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:9px;color:var(--muted);letter-spacing:.05em}
.pill{display:inline-block;padding:2px 7px;font-family:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:28px 18px;border:1px dashed var(--line);color:var(--muted);text-align:center}

.blocks{display:flex;flex-direction:column;gap:10px}
.block{border:1px solid var(--line);background:var(--surface)}
.block>.bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--row)}
.block>.bh h3{font-size:19px;font-weight:600;letter-spacing:.03em}
.block>.bh .meta{font-family:var(--m);font-size:11.5px;color:var(--muted)}
.block>.bh .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--row)}
.lot{background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer;text-align:left}
.lot:hover{background:var(--row)}
.lot .id{font-family:var(--m);font-weight:500;font-size:12.5px}
.lot .sz{font-family:var(--m);font-size:11px;color:var(--muted)}
.lot .ar{font-family:var(--d);font-size:17px;font-weight:600;margin-top:2px}
.lot .ar small{font-family:var(--m);font-size:10px;font-weight:400;color:var(--muted)}
.addlot{background:var(--surface);padding:10px 12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--m);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;min-height:70px}
.addlot:hover{background:var(--row);color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{border:1px solid var(--line);background:var(--surface);text-align:left;padding:0;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:4/3;background:var(--row);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--m);font-size:10px;letter-spacing:.05em}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pcard .bd b{font-family:var(--d);font-size:17px;font-weight:600;letter-spacing:.02em}
.pcard .bd span{font-size:12.5px;color:var(--muted)}
.pcard .bd .pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

.notice{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice.bad{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.notice p{margin:0;flex:1 1 260px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.panel{border:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.panel p{margin:0;color:var(--muted);font-size:13px}
.panel ol{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.drop{border:1px dashed var(--line);padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.prog{font-family:var(--m);font-size:12px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(20,23,22,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dh h2{font-size:22px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.drawer .dh small{display:block;font-family:var(--m);font-size:11px;color:var(--muted);text-transform:none;letter-spacing:.03em}
.drawer .db{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer .df{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.drawer .df .sp{flex:1}
.x{font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.sizes{display:flex;flex-direction:column;gap:6px}
.sizes .srow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center}
.photo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.photo .pv{width:96px;height:72px;object-fit:cover;border:1px solid var(--line);background:var(--row);display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:9px;color:var(--muted)}
.photo .pv img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pc{display:flex;flex-direction:column;gap:6px}
.photo .pc .row{display:flex;gap:6px;flex-wrap:wrap}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shot{position:relative;width:88px}
.shot img{width:88px;height:66px;object-fit:cover;border:1px solid var(--line);display:block}
.shot button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-family:var(--m);font-size:12px;letter-spacing:.04em;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:12px 16px 10px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin:0 -4px;scrollbar-width:none}
  .nav a{border-left:none;border-bottom:2px solid transparent;padding:7px 10px;white-space:nowrap}
  .nav a.on{border-bottom-color:var(--accent)}
  .nav a small{display:none}
  .sidefoot{display:none}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}} }
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <div class="brand"><b>GM Stone</b><span>Admin · stock &amp; catalogue</span></div>
    <p>Sign in to change what the website shows.</p>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn amber" type="submit" id="loginBtn">Sign in</button>
    <p><a href="/">← Back to the website</a></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><b>GM Stone</b><span>Admin · stock &amp; catalogue</span></div>
    <nav class="nav" id="nav">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#cargo" data-v="cargo">Cargo <small id="nCargo"></small></a>
      <a href="#stock" data-v="stock">Stock <small id="nStock"></small></a>
      <a href="#order" data-v="order">To order <small id="nOrder"></small></a>
      <a href="#projects" data-v="projects">Projects <small id="nProjects"></small></a>
      <a href="#settings" data-v="settings">Settings</a>
    </nav>
    <div class="sidefoot">
      <span class="sync" id="sync"><i></i><span>Loading…</span></span>
      <span><a href="/" target="_blank" rel="noopener">Open website ↗</a> · <a id="signout">Sign out</a></span>
    </div>
  </aside>
  <main class="main"><div class="in" id="view"></div></main>
</div>
<div id="drawerHost"></div>
<div id="toastHost"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="siteIn" accept=".html,.htm,.json,text/html,application/json" hidden>

<script>
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(+n||0).toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(+n||0).toLocaleString("en",{maximumFractionDigits:0});
const CATS=["Marble","Travertine","Quartzite","Onyx","Granite","Limestone","Other"];
const driveId=s=>{ s=(s||"").trim(); if(!s) return null; if(/^https?:/i.test(s)){ const m=s.match(/[?&]id=([-\w]{20,})/)||s.match(/\/d\/([-\w]{20,})/); return m?m[1]:null; } return /^[-\w]{20,}$/.test(s)?s:null; };
const driveImg=id=>"https://lh3.googleusercontent.com/d/"+id+"=w1200";
const driveFb=id=>"https://drive.google.com/thumbnail?id="+id+"&sz=w1200";
const clone=o=>JSON.parse(JSON.stringify(o));
const lotTot=B=>({pcs:(B.lots||[]).reduce((a,l)=>a+(+l.pcs||0),0),m2:(B.lots||[]).reduce((a,l)=>a+(+l.m2||0),0)});
const nextKey=(list,prefix)=>prefix+(list.reduce((m,x)=>Math.max(m,parseInt(String(x.key||"").slice(1))||0),0)+1);
let toastT; function toast(msg,bad){ const h=$("#toastHost"); h.innerHTML=`<div class="toast${bad?" bad":""}">${esc(msg)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>h.innerHTML="",bad?6000:2600); }
function setSync(cls,text){ const s=$("#sync"); s.className="sync "+cls; s.lastElementChild.textContent=text; }

/* ============================ api ============================ */
const TOKEN_KEY="gmstone.admin.token";
let token=""; try{ token=localStorage.getItem(TOKEN_KEY)||""; }catch(e){}
async function api(path,opt={}){
  // the login pass goes in X-Admin-Token: Codespaces port forwarding uses the Authorization header itself
  const headers=Object.assign({},opt.headers||{}); if(token) headers["x-admin-token"]=token;
  let r; try{ r=await fetch("/api/"+path,Object.assign({},opt,{headers})); }catch(e){ throw {status:0,error:"No connection"}; }
  let body=null; const ct=r.headers.get("content-type")||""; if(ct.includes("json")) body=await r.json().catch(()=>null); else body=await r.text().catch(()=>null);
  if(!r.ok){ if(r.status===401&&path!=="login") signOut(true); throw Object.assign({status:r.status},typeof body==="object"&&body?body:{error:String(body||r.statusText)}); }
  return body;
}
function signOut(expired){ token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} $("#app").hidden=true; $("#login").hidden=false; $("#loginErr").textContent=expired?"Your session has ended. Sign in again.":""; $("#pw").value=""; $("#pw").focus(); }

/* ============================ state ============================ */
const state={data:null,rev:0,updatedAt:null,saving:false};
const EMPTY=()=>({DATA:[],STOCK:[],ORDER:[],PROJECTS:[],ENQ_TO:"info@gmstone.ae",WA_NO:"97145768792"});

async function loadData(){
  setSync("busy","Loading…");
  const doc=await api("data");
  state.rev=doc.rev||0; state.updatedAt=doc.updatedAt||null; state.data=doc.data||null;
  setSync(state.data?"ok":"busy",state.data?"Live · rev "+state.rev:"Not set up yet");
  render();
}
/* Save the whole catalogue. Every edit calls this, so the website changes immediately. */
async function commit(what){
  if(state.saving){ toast("Still saving the previous change…",true); return false; }
  state.saving=true; setSync("busy","Saving…");
  try{
    const r=await api("data",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({rev:state.rev,data:state.data})});
    state.rev=r.rev; state.updatedAt=r.updatedAt; setSync("ok","Live · rev "+state.rev); toast(what?what+" — live":"Saved — live"); render(); return true;
  }catch(e){
    setSync("bad","Not saved");
    if(e.status===409){ toast(e.error,true); await loadData(); }
    else toast("Could not save: "+(e.error||e.status),true);
    return false;
  }finally{ state.saving=false; }
}
async function uploadImage(blob){
  const r=await api("upload",{method:"POST",headers:{"content-type":blob.type||"image/jpeg"},body:blob});
  return r.url;
}

/* ============================ first-time setup ============================ */
function parseSiteFile(text){
  const grab=name=>{ let m=text.match(new RegExp("^const "+name+" = \\(window\\.GM_LIVE&&window\\.GM_LIVE\\."+name+"!=null\\?window\\.GM_LIVE\\."+name+":(\\[.*\\])\\);\\s*$","m")); if(!m) m=text.match(new RegExp("^const "+name+" = (\\[.*\\]);\\s*$","m")); return m?JSON.parse(m[1]):null; };
  const d={DATA:grab("DATA"),STOCK:grab("STOCK"),ORDER:grab("ORDER"),PROJECTS:grab("PROJECTS")||[]};
  if(!d.DATA||!d.STOCK||!d.ORDER) return null;
  d.ENQ_TO=(text.match(/"(info@[^"]+)"/)||[])[1]||"info@gmstone.ae";
  d.WA_NO=(text.match(/WA_NO=[^;]*"(\d{8,15})"/)||[])[1]||"97145768792";
  return d;
}
const dataUriToBlob=u=>fetch(u).then(r=>r.blob());
/* Move photos embedded in the data (data:image/…) to uploaded files, so the live data stays small. */
async function migrateEmbedded(d,onStep){
  const jobs=[];
  d.STOCK.forEach(S=>{ if(/^data:/.test(S.img||"")) jobs.push(async()=>{ S.img=await uploadImage(await dataUriToBlob(S.img)); }); (S.gallery||[]).forEach((g,i)=>{ if(/^data:/.test(g||"")) jobs.push(async()=>{ S.gallery[i]=await uploadImage(await dataUriToBlob(g)); }); }); });
  d.ORDER.forEach(O=>{ if(/^data:/.test(O.img||"")) jobs.push(async()=>{ O.img=await uploadImage(await dataUriToBlob(O.img)); }); (O.shots||[]).forEach(s=>{ if(/^data:/.test(s.img||"")) jobs.push(async()=>{ s.img=await uploadImage(await dataUriToBlob(s.img)); }); }); });
  d.PROJECTS.forEach(P=>(P.shots||[]).forEach(s=>{ if(/^data:/.test(s.img||"")) jobs.push(async()=>{ s.img=await uploadImage(await dataUriToBlob(s.img)); }); }));
  d.DATA.forEach(B=>(B.lots||[]).forEach(l=>{ if(/^data:/.test(l.img||"")) jobs.push(async()=>{ l.img=await uploadImage(await dataUriToBlob(l.img)); }); }));
  for(let i=0;i<jobs.length;i++){ onStep&&onStep(i+1,jobs.length); await jobs[i](); }
  return jobs.length;
}
async function setupFromSite(prog){
  prog("Reading the website file…");
  const t=await fetch("/index.html",{cache:"no-store"}).then(r=>r.text());
  const d=parseSiteFile(t); if(!d) throw new Error("Could not read the catalogue data from /index.html");
  const n=await migrateEmbedded(d,(i,nn)=>prog("Moving embedded photo "+i+" of "+nn+"…"));
  state.data=d; prog("Saving…");
  const ok=await commit("Catalogue set up"); if(!ok) throw new Error("save failed");
  return n;
}

function photoField(id,img,fb,label){ photoState[id]={img:img||"",fb:fb||""}; return `<div class="field"><label>${esc(label||"Photo")}</label><div class="photo" id="ph_${id}">${photoInner(id)}</div></div>`; }
function photoInner(id){ const p=photoState[id];
  return `<div class="pv">${p.img?`<img src="${esc(p.img)}" alt="" referrerpolicy="no-referrer">`:"no photo"}</div><div class="pc"><input id="pl_${id}" placeholder="Paste a Google Drive link or file ID" aria-label="Google Drive link"><div class="row"><button class="btn sm" data-pl="${id}">Use link</button><button class="btn sm" data-pu="${id}">Upload photo</button>${p.img?`<button class="btn sm ghost" data-px="${id}">Remove</button>`:""}</div><span class="hint" id="pm_${id}">${p.img.startsWith("/api/img/")?"Uploaded photo":p.img.startsWith("data:")?"Embedded photo":p.img?"Linked":"Drive links must be shared with “anyone with the link”."}</span></div>`; }
function wirePhotos(){
  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ const id=b.dataset.pl, v=$("#pl_"+id).value, d=driveId(v); if(d){ photoState[id]={img:driveImg(d),fb:driveFb(d)}; } else if(/^https?:\/\//.test(v.trim())){ photoState[id]={img:v.trim(),fb:""}; } else { toast("Paste a Google Drive link, a file ID or an image URL",true); return; } $("#ph_"+id).innerHTML=photoInner(id); wirePhotos(); });
  document.querySelectorAll("[data-pu]").forEach(b=>b.onclick=()=>pickImage(async blob=>{ const id=b.dataset.pu; $("#pm_"+id).textContent="Uploading…"; try{ const url=await uploadImage(blob); photoState[id]={img:url,fb:""}; $("#ph_"+id).innerHTML=photoInner(id); wirePhotos(); }catch(e){ toast("Upload failed: "+(e.error||e.message),true); $("#pm_"+id).textContent=""; } }));
  document.querySelectorAll("[data-px]").forEach(b=>b.onclick=()=>{ photoState[b.dataset.px]={img:"",fb:""}; $("#ph_"+b.dataset.px).innerHTML=photoInner(b.dataset.px); wirePhotos(); });
}
function pickImage(cb){ const i=$("#fileIn"); i.onchange=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return; try{ cb(await compress(f)); }catch(err){ toast("Could not read that image",true); } }; i.click(); }
/* resize to 1600px max and JPEG-encode so uploads stay small (≈ 150–400 KB) */
function compress(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ URL.revokeObjectURL(url); let max=1600,qlt=.86; const step=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>{ if(b&&b.size>450000&&max>800){ max*=.8; qlt-=.06; step(); } else res(b); },"image/jpeg",qlt); }; step(); }; img.onerror=rej; img.src=url; }); }
/* shots list (gallery) */
let shotsState={};
function shotsField(id,shots,label){ shotsState[id]=(shots||[]).map(s=>typeof s==="string"?{img:s,fb:""}:{img:s.img||"",fb:s.fb||"",rot:s.rot||0}); return `<div class="field"><label>${esc(label||"More photos")}</label><div id="sh_${id}">${shotsInner(id)}</div></div>`; }
function shotsInner(id){ const L=shotsState[id]; return `<div class="shots">${L.map((s,i)=>`<span class="shot"><img src="${esc(s.img)}" alt="" referrerpolicy="no-referrer"><button data-sx="${id}:${i}" aria-label="Remove photo">×</button></span>`).join("")}</div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="sl_${id}" placeholder="Google Drive link or file ID" aria-label="Drive link" style="flex:1 1 200px"><button class="btn sm" data-sl="${id}">Add link</button><button class="btn sm" data-su="${id}">Upload</button><span class="prog" id="sm_${id}"></span></div>`; }
function wireShots(){
  document.querySelectorAll("[data-sx]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.sx.split(":"); shotsState[id].splice(+i,1); $("#sh_"+id).innerHTML=shotsInner(id); wireShots(); });
  document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{ const id=b.dataset.sl, v=$("#sl_"+id).value, d=driveId(v); if(d) shotsState[id].push({img:driveImg(d),fb:driveFb(d)}); else if(/^https?:\/\//.test(v.trim())) shotsState[id].push({img:v.trim(),fb:""}); else { toast("Paste a Google Drive link or file ID",true); return; } $("#sh_"+id).innerHTML=shotsInner(id); wireShots(); });
  document.querySelectorAll("[data-su]").forEach(b=>b.onclick=()=>pickImage(async blob=>{ const id=b.dataset.su; $("#sm_"+id).textContent="Uploading…"; try{ const url=await uploadImage(blob); shotsState[id].push({img:url,fb:""}); $("#sh_"+id).innerHTML=shotsInner(id); wireShots(); }catch(e){ toast("Upload failed: "+(e.error||e.message),true); $("#sm_"+id).textContent=""; } }));
}

/* ---- block ---- */
function editBlock(i){
  const D=state.data.DATA, isNew=i<0;
  const B=isNew?{block:"",material:"",cat:"Marble",arrived:false,new:true,lots:[]}:clone(D[i]);
  openDrawer(isNew?"New block":"Edit block",isNew?"Add bundles after saving":(B.lots||[]).length+" bundle"+((B.lots||[]).length===1?"":"s")+" · edit bundles from the cargo list",
    `<div class="grid2">${F("block","Block number",B.block,{cls:"mono",ph:"e.g. 4573"})}${F("cat","Category",B.cat,{select:CATS})}</div>
     ${F("material","Material · finish",B.material,{ph:"e.g. White Travertine · Raw"})}
     ${F("title","Display title (optional)",B.title||"",{hint:"Shown instead of “Block 4573”. Start with “Container” to count it as a container on the site."})}
     <div class="checks">${C("arrived","Arrived · in stock",B.arrived)}${C("new","New",B.new)}${C("hot","★ Hot",B.hot)}${C("seq","Cut in sequence (book-match)",B.seq)}</div>`,
    delFoot("Delete this block and all its bundles?"));
  wireFoot(async()=>{ const r={...B,block:V("block"),cat:V("cat"),material:V("material"),arrived:V("arrived"),new:V("new")}; const t=V("title"); if(t) r.title=t; else delete r.title; if(V("hot")) r.hot=true; else delete r.hot; if(V("seq")) r.seq=true; else delete r.seq;
      if(!r.block&&!r.title){ toast("Give the block a number or a title",true); return; } if(isNew) D.push(r); else D[i]=r; if(await commit((isNew?"Added ":"Updated ")+(r.title||"Block "+r.block))) closeDrawer(); },
    isNew?null:async()=>{ D.splice(i,1); if(await commit("Deleted "+(B.title||"Block "+B.block))) closeDrawer(); });
}
/* ---- bundle (lot) ---- */
function editLot(bi,li){
  const B=state.data.DATA[bi]; if(!B) return; B.lots=B.lots||[]; const isNew=li<0;
  const L=isNew?{id:B.block+"/"+(B.lots.length+1),pcs:0,m2:0,net:[[0,0,0]]}:clone(B.lots[li]); L.net=L.net&&L.net.length?L.net:[[0,0,0]];
  const sizeRows=()=>L.net.map((n,i)=>`<div class="srow"><input type="number" class="num" data-n="${i}:0" value="${n[0]||""}" placeholder="Width" aria-label="Width cm"><input type="number" class="num" data-n="${i}:1" value="${n[1]||""}" placeholder="Length" aria-label="Length cm"><input type="number" class="num" data-n="${i}:2" value="${n[2]||""}" placeholder="Pcs" aria-label="Pieces"><button class="x" data-nx="${i}" aria-label="Remove size">×</button></div>`).join("");
  openDrawer(isNew?"New bundle":"Edit bundle",(B.title||"Block "+B.block)+" · "+B.material,
    `<div class="grid3">${F("lid","Bundle no.",L.id,{cls:"mono"})}${F("pcs","Slabs",L.pcs,{type:"number"})}${F("m2","m²",L.m2,{type:"number",step:"0.01"})}</div>
     <div class="field"><label>Net slab sizes · width × length cm × pieces</label><div class="sizes" id="sizes">${sizeRows()}</div><div class="bar" style="margin-top:6px"><button class="btn sm" id="addSize">+ Size</button><button class="btn sm ghost" id="calc">Calculate m² and slabs from sizes</button></div></div>
     ${F("label","Sawn size on the card (optional)",L.label||"",{hint:"Shown under the sizes, e.g. “2 × 132 × 243 · 12 pcs”."})}
     ${photoField("lot",L.img,L.fb,"Bundle photo")}`,
    delFoot("Remove this bundle from the block?"));
  wirePhotos();
  const readNet=()=>{ const rows={}; document.querySelectorAll("[data-n]").forEach(i=>{ const [r,c]=i.dataset.n.split(":"); (rows[r]=rows[r]||[0,0,0])[+c]=parseFloat(i.value)||0; }); return Object.values(rows).filter(n=>n[0]||n[1]||n[2]); };
  const rewire=()=>{ document.querySelectorAll("[data-nx]").forEach(b=>b.onclick=()=>{ L.net=readNet(); L.net.splice(+b.dataset.nx,1); if(!L.net.length) L.net=[[0,0,0]]; $("#sizes").innerHTML=sizeRows(); rewire(); }); };
  rewire();
  $("#addSize").onclick=()=>{ L.net=readNet(); L.net.push([0,0,0]); $("#sizes").innerHTML=sizeRows(); rewire(); };
  $("#calc").onclick=()=>{ const net=readNet(); $("#f_pcs").value=net.reduce((a,n)=>a+n[2],0); $("#f_m2").value=(net.reduce((a,n)=>a+n[0]*n[1]*n[2],0)/10000).toFixed(2); };
  wireFoot(async()=>{ const r={id:V("lid"),pcs:N("pcs"),m2:N("m2"),net:readNet()}; if(photoState.lot.img){ r.img=photoState.lot.img; if(photoState.lot.fb) r.fb=photoState.lot.fb; } const lb=V("label"); if(lb) r.label=lb; if(!r.id){ toast("Give the bundle a number",true); return; }
      if(isNew) B.lots.push(r); else B.lots[li]=r; if(await commit((isNew?"Added bundle ":"Updated bundle ")+r.id)) closeDrawer(); },
    isNew?null:async()=>{ B.lots.splice(li,1); if(await commit("Removed bundle "+L.id)) closeDrawer(); });
}
/* ---- stock ---- */
function editStock(i){
  const ST=state.data.STOCK, isNew=i<0;
  const S=isNew?{name:"",m2:0,pcs:0,size:"",note:"",img:"",origin:null,finish:"Polished",gallery:null,cat:"Marble",key:nextKey(ST,"s"),grp:3,loc:"Dubai",special:false}:clone(ST[i]);
  openDrawer(isNew?"New stock item":"Edit stock item",isNew?"":S.name,
    `${F("name","Material name",S.name,{ph:"e.g. CALACATTA VIOLA"})}
     <div class="grid2">${F("cat","Category",S.cat,{select:CATS})}${F("finish","Finish",S.finish||"",{ph:"Polished · bookmatched"})}</div>
     <div class="grid3">${F("m2","m² available",S.m2,{type:"number",step:"0.01"})}${F("pcs","Slabs",S.pcs,{type:"number"})}${F("size","Slab size",S.size||"",{ph:"302 × 200 cm"})}</div>
     ${F("note","Description",S.note||"",{area:true})}
     <div class="grid2">${F("origin","Origin",S.origin||"",{ph:"Italy"})}${F("loc","Location",S.loc||"Dubai")}</div>
     <div class="grid2">${F("grp","Position in list",["1","2","3"].includes(String(S.grp))?String(S.grp):"3",{select:["1","2","3"],hint:"1 shows first, 3 last within its category."})}${F("price","Special price · AED per m² (optional)",S.price||"",{cls:"mono"})}</div>
     <div class="checks">${C("special","Special price",S.special)}${C("hot","★ Hot · featured",S.hot)}</div>
     ${photoField("st",S.img,S.fb,"Main photo")}
     ${shotsField("stg",S.gallery||[],"Gallery")}`,
    delFoot("Remove this material from stock (sold out)?"));
  wirePhotos(); wireShots();
  wireFoot(async()=>{ const r={...S,name:V("name"),cat:V("cat"),finish:V("finish")||null,m2:N("m2"),pcs:N("pcs"),size:V("size"),note:V("note"),origin:V("origin")||null,loc:V("loc")||"Dubai",grp:+V("grp")||3,special:V("special"),img:photoState.st.img};
      if(photoState.st.fb) r.fb=photoState.st.fb; else delete r.fb; const pr=V("price"); if(pr) r.price=pr; else delete r.price; if(V("hot")) r.hot=true; else delete r.hot; const g=shotsState.stg.map(s=>s.img).filter(Boolean); r.gallery=g.length?g:null;
      if(!r.name){ toast("Give the material a name",true); return; } if(isNew) ST.push(r); else ST[i]=r; if(await commit((isNew?"Added ":"Updated ")+r.name)) closeDrawer(); },
    isNew?null:async()=>{ ST.splice(i,1); if(await commit("Removed from stock: "+S.name)) closeDrawer(); });
}
/* ---- order ---- */
function editOrder(i){
  const OR=state.data.ORDER, isNew=i<0;
  const O=isNew?{name:"",block:"brought in to order",cat:"Marble",img:"",fb:null,key:nextKey(OR,"o"),note:"",isnew:true}:clone(OR[i]);
  openDrawer(isNew?"New to-order item":"Edit to-order item",isNew?"":O.name,
    `${F("name","Material name",O.name)}
     <div class="grid2">${F("cat","Category",O.cat,{select:CATS})}${F("sel","Selection label (optional)",O.sel||"",{ph:"Selection 1"})}</div>
     ${F("block","Block / availability line",O.block||"",{hint:"Shown under the name, e.g. “brought in to order” or “Selection 1 — block ref on request”."})}
     ${F("note","Description",O.note||"",{area:true})}
     <div class="checks">${C("classic","Always available (classic)",O.classic)}${C("isnew","New selection",O.isnew)}</div>
     ${photoField("or",O.img,O.fb,"Main photo")}
     ${shotsField("ors",O.shots||[],"More photos")}`,
    delFoot("Remove this item from the order catalogue?"));
  wirePhotos(); wireShots();
  wireFoot(async()=>{ const r={...O,name:V("name"),cat:V("cat"),block:V("block")||"brought in to order",note:V("note"),img:photoState.or.img,fb:photoState.or.fb||null};
      const sel=V("sel"); if(sel) r.sel=sel; else delete r.sel; if(V("classic")) r.classic=true; else delete r.classic; if(V("isnew")) r.isnew=true; else delete r.isnew; const sh=shotsState.ors.filter(s=>s.img).map(s=>({img:s.img,fb:s.fb||null})); if(sh.length) r.shots=sh; else delete r.shots;
      if(!r.name){ toast("Give the material a name",true); return; } if(isNew) OR.push(r); else OR[i]=r; if(await commit((isNew?"Added ":"Updated ")+r.name)) closeDrawer(); },
    isNew?null:async()=>{ OR.splice(i,1); if(await commit("Removed to-order: "+O.name)) closeDrawer(); });
}
/* ---- project ---- */
function editProject(i){
  const PR=state.data.PROJECTS, isNew=i<0;
  const P=isNew?{name:"",loc:"",type:"Private villa",stone:"",shots:[],scope:"Supply & installation"}:clone(PR[i]);
  openDrawer(isNew?"New project":"Edit project",isNew?"":P.name,
    `${F("name","Project name",P.name,{ph:"Dubai Hills Villa"})}
     <div class="grid2">${F("loc","Location",P.loc||"",{ph:"Dubai Hills Estate, Dubai"})}${F("type","Type",P.type||"")}</div>
     ${F("stone","Stone used",P.stone||"",{area:true})}
     <div class="grid2">${F("scope","Scope",P.scope||"")}${F("reel","Instagram reel code (optional)",P.reel||"",{cls:"mono",hint:"The part after instagram.com/reel/"})}</div>
     ${shotsField("prs",P.shots||[],"Photos · first one is the cover")}`,
    delFoot("Delete this project?"));
  wireShots();
  wireFoot(async()=>{ const r={...P,name:V("name"),loc:V("loc"),type:V("type"),stone:V("stone"),scope:V("scope"),shots:shotsState.prs.filter(s=>s.img).map(s=>{ const x={img:s.img,fb:s.fb||null}; if(s.rot) x.rot=s.rot; return x; })};
      const reel=V("reel").replace(/^.*\/reel\//,"").replace(/\/.*$/,""); if(reel) r.reel=reel; else delete r.reel;
      if(!r.name){ toast("Give the project a name",true); return; } if(isNew) PR.push(r); else PR[i]=r; if(await commit((isNew?"Added project ":"Updated project ")+r.name)) closeDrawer(); },
    isNew?null:async()=>{ PR.splice(i,1); if(await commit("Deleted project "+P.name)) closeDrawer(); });
}

/* ============================ boot ============================ */
$("#loginForm").onsubmit=async e=>{
  e.preventDefault(); const b=$("#loginBtn"); b.disabled=true; $("#loginErr").textContent="";
  try{ const r=await api("login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#pw").value})}); token=r.token; try{ localStorage.setItem(TOKEN_KEY,token); }catch(x){} await enter(); }
  catch(err){ $("#loginErr").textContent=err.error||"Could not sign in"; }
  finally{ b.disabled=false; }
};
$("#signout").onclick=()=>signOut(false);
async function enter(){ $("#login").hidden=true; $("#app").hidden=false; route(); try{ await loadData(); }catch(e){ if(e.status!==401){ setSync("bad","Could not load"); toast("Could not load the catalogue: "+(e.error||e.status),true); } } }
(async()=>{
  if(token){ try{ await api("me"); await enter(); return; }catch(e){ token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(x){} } }
  $("#login").hidden=false; $("#pw").focus();
  try{ const s=await api("status"); if(!s.configured) $("#loginErr").textContent="The admin password hasn't been set up yet. In Netlify: Project configuration > Environment variables > ADMIN_PASSWORD, then deploy again."; }catch(e){}
})();
</script>
