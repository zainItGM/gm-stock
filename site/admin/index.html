<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GM Stone Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F2EE; --surface:#FFFFFF; --row:#F7F7F4; --ink:#1B1F1D; --muted:#5B6662; --line:#D6D8D2;
  --accent:#B0813F; --accent-soft:#F4ECDD; --accent-ink:#1B1F1D;
  --nav:#1B1F1D; --nav-fg:#EDEDE8; --nav-dim:#8E9A93;
  --ok:#3E7A52; --ok-soft:#E6F0E8; --warn:#8A6A2F; --warn-soft:#F4ECDD; --bad:#8C4A45; --bad-soft:#FCF6F5;
  --d:'Barlow Condensed',system-ui,sans-serif; --b:'Inter',system-ui,sans-serif; --m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#141716; --surface:#1E2220; --row:#232826; --ink:#ECEDE8; --muted:#9BA6A0; --line:#353B39;
  --accent:#D2A35E; --accent-soft:#2E2718; --accent-ink:#141716; --nav:#0F1211; --nav-fg:#EDEDE8; --nav-dim:#7F8A85;
  --ok:#7FBF93; --ok-soft:#1E2F24; --warn:#D6B06A; --warn-soft:#2E2718; --bad:#E08C85; --bad-soft:#33221F; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:76px;resize:vertical}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0;font-family:var(--d);text-wrap:balance}
.mono{font-family:var(--m)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--nav);color:var(--nav-fg)}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;background:var(--bg);color:var(--ink);padding:28px 26px;border-top:3px solid var(--accent)}
.login .brand b{font-size:28px}
.login .brand span{color:var(--accent)}
.login p{margin:0;color:var(--muted);font-size:13px}
.login .err{color:var(--bad);font-size:13px;min-height:1.2em}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-fg);padding:22px 16px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--d);font-weight:700;font-size:24px;letter-spacing:.10em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;color:var(--nav-fg);text-decoration:none;border-left:2px solid transparent;font-weight:500}
.nav a small{font-family:var(--m);font-size:11px;color:var(--nav-dim)}
.nav a.on{border-left-color:var(--accent);background:rgba(255,255,255,.06);color:#fff}
.nav a:hover{background:rgba(255,255,255,.05)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--nav-dim)}
.sidefoot a{color:var(--nav-dim);cursor:pointer;text-decoration:underline}
.sync{display:inline-flex;align-items:center;gap:7px;font-family:var(--m);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-fg)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--nav-dim);flex:none}
.sync.ok i{background:#7FBF93}.sync.busy i{background:#D6B06A}.sync.bad i{background:#E08C85}

.main{min-width:0;padding:22px 16px 72px}
.main>.in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.head h1{font-size:30px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--ink);font-family:var(--d);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.amber{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--surface);padding:14px 16px}
.tile i{display:block;font-style:normal;font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tile b{font-family:var(--d);font-size:30px;font-weight:600;line-height:1;letter-spacing:.02em}
.tile b small{font-family:var(--m);font-size:11px;font-weight:400;color:var(--muted);margin-left:4px;letter-spacing:0}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{max-width:320px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border:1px solid var(--line);background:var(--surface);font-family:var(--m);font-size:11.5px;letter-spacing:.03em}
.chip small{color:var(--muted);margin-left:5px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.on small{color:inherit;opacity:.7}

.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 span{font-family:var(--m);font-size:11px;font-weight:400;letter-spacing:.05em;color:var(--muted);text-transform:none}
.tblwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--row);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--row)}
td.r,th.r{text-align:right}
td .name{font-weight:600}
td .sub{color:var(--muted);font-size:12.5px;max-width:42ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb{width:52px;height:40px;object-fit:cover;background:var(--row);border:1px solid var(--line);display:block}
.thumb.none{display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:9px;color:var(--muted);letter-spacing:.05em}
.pill{display:inline-block;padding:2px 7px;font-family:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pill.acc{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.empty{padding:28px 18px;border:1px dashed var(--line);color:var(--muted);text-align:center}

.blocks{display:flex;flex-direction:column;gap:10px}
.block{border:1px solid var(--line);background:var(--surface)}
.block>.bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--row)}
.block>.bh h3{font-size:19px;font-weight:600;letter-spacing:.03em}
.block>.bh .meta{font-family:var(--m);font-size:11.5px;color:var(--muted)}
.block>.bh .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--row)}
.lot{background:var(--surface);padding:10px 12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;cursor:pointer;text-align:left}
.lot:hover{background:var(--row)}
.lot .id{font-family:var(--m);font-weight:500;font-size:12.5px}
.lot .sz{font-family:var(--m);font-size:11px;color:var(--muted)}
.lot .ar{font-family:var(--d);font-size:17px;font-weight:600;margin-top:2px}
.lot .ar small{font-family:var(--m);font-size:10px;font-weight:400;color:var(--muted)}
.addlot{background:var(--surface);padding:10px 12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--m);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;min-height:70px}
.addlot:hover{background:var(--row);color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{border:1px solid var(--line);background:var(--surface);text-align:left;padding:0;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:4/3;background:var(--row);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--m);font-size:10px;letter-spacing:.05em}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.pcard .bd b{font-family:var(--d);font-size:17px;font-weight:600;letter-spacing:.02em}
.pcard .bd span{font-size:12.5px;color:var(--muted)}
.pcard .bd .pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

.notice{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice.bad{border-left-color:var(--bad)}
.notice.ok{border-left-color:var(--ok)}
.notice p{margin:0;flex:1 1 260px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.panel{border:1px solid var(--line);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.panel p{margin:0;color:var(--muted);font-size:13px}
.panel ol{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px}
.drop{border:1px dashed var(--line);padding:14px;text-align:center;color:var(--muted);font-size:13px}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.prog{font-family:var(--m);font-size:12px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(20,23,22,.45);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.drawer .dh h2{font-size:22px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.drawer .dh small{display:block;font-family:var(--m);font-size:11px;color:var(--muted);text-transform:none;letter-spacing:.03em}
.drawer .db{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.drawer .df{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.drawer .df .sp{flex:1}
.x{font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.sizes{display:flex;flex-direction:column;gap:6px}
.sizes .srow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center}
.photo{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.photo .pv{width:96px;height:72px;object-fit:cover;border:1px solid var(--line);background:var(--row);display:flex;align-items:center;justify-content:center;font-family:var(--m);font-size:9px;color:var(--muted)}
.photo .pv img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pc{display:flex;flex-direction:column;gap:6px}
.photo .pc .row{display:flex;gap:6px;flex-wrap:wrap}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shot{position:relative;width:88px}
.shot img{width:88px;height:66px;object-fit:cover;border:1px solid var(--line);display:block}
.shot button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-family:var(--m);font-size:12px;letter-spacing:.04em;z-index:40;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
.badimg{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;min-height:40px;border:1px dashed var(--bad);color:var(--bad);background:var(--bad-soft);font-family:var(--m);font-size:9px;letter-spacing:.05em;text-transform:uppercase;line-height:1.2}
.thumb.badimg{width:52px;height:40px;min-height:0}
.toast button{margin-left:12px;padding:3px 10px;border:1px solid currentColor;color:inherit;font-family:var(--d);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}

/* hidden from the site */
.off{opacity:.55}
.off:hover{opacity:.8}
.chip.hid{border-color:var(--bad);color:var(--bad)}
.chip.hid.on{background:var(--bad);border-color:var(--bad);color:#fff}

/* ordered photo list */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:6px}
.pbtns .btn[data-pr]{margin-left:auto}
.pitem{border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.pitem.main{border-color:var(--accent)}
.pimg{position:relative;aspect-ratio:4/3;background:var(--row);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pmain,.pno{position:absolute;left:6px;top:6px;padding:2px 7px;font-family:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.pmain{background:var(--accent);color:var(--accent-ink)}
.pno{background:rgba(20,23,22,.7);color:#fff}
.pbtns{display:flex;gap:4px;flex-wrap:wrap;padding:6px}
.pbtns .btn{padding:4px 8px;font-size:12px}
.padd{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.padd input{flex:1 1 200px}

/* move to stock */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;cursor:pointer;font-weight:500}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{accent-color:var(--accent);margin:0}
.mvlots{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;max-height:240px;overflow:auto}
.bar .lab{font-family:var(--m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* history */
.diff{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink)}
.diff b{font-weight:600}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:12px 16px 10px;gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;margin:0 -4px;scrollbar-width:none}
  .nav a{border-left:none;border-bottom:2px solid transparent;padding:7px 10px;white-space:nowrap}
  .nav a.on{border-bottom-color:var(--accent)}
  .nav a small{display:none}
  .sidefoot{display:none}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}} }
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm">
    <div class="brand"><b>GM Stone</b><span>Admin · stock &amp; catalogue</span></div>
    <p>Sign in to change what the website shows.</p>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn amber" type="submit" id="loginBtn">Sign in</button>
    <p><a href="/">← Back to the website</a></p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><b>GM Stone</b><span>Admin · stock &amp; catalogue</span></div>
    <nav class="nav" id="nav">
      <a href="#overview" data-v="overview">Overview</a>
      <a href="#cargo" data-v="cargo">Cargo <small id="nCargo"></small></a>
      <a href="#stock" data-v="stock">Stock <small id="nStock"></small></a>
      <a href="#order" data-v="order">To order <small id="nOrder"></small></a>
      <a href="#projects" data-v="projects">Projects <small id="nProjects"></small></a>
      <a href="#history" data-v="history">History</a>
      <a href="#settings" data-v="settings">Settings</a>
    </nav>
    <div class="sidefoot">
      <span class="sync" id="sync"><i></i><span>Loading…</span></span>
      <span><a href="/" target="_blank" rel="noopener">Open website ↗</a> · <a id="signout">Sign out</a></span>
    </div>
  </aside>
  <main class="main"><div class="in" id="view"></div></main>
</div>
<div id="drawerHost"></div>
<div id="toastHost"></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="siteIn" accept=".html,.htm,.json,text/html,application/json" hidden>

<script>
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(+n||0).toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(+n||0).toLocaleString("en",{maximumFractionDigits:0});
const CATS=["Marble","Travertine","Quartzite","Onyx","Granite","Limestone","Other"];
const driveId=s=>{ s=(s||"").trim(); if(!s) return null; if(/^https?:/i.test(s)){ const m=s.match(/[?&]id=([-\w]{20,})/)||s.match(/\/d\/([-\w]{20,})/); return m?m[1]:null; } return /^[-\w]{20,}$/.test(s)?s:null; };
const driveImg=id=>"https://lh3.googleusercontent.com/d/"+id+"=w1200";
const driveFb=id=>"https://drive.google.com/thumbnail?id="+id+"&sz=w1200";
const clone=o=>JSON.parse(JSON.stringify(o));
const lotTot=B=>({pcs:(B.lots||[]).reduce((a,l)=>a+(+l.pcs||0),0),m2:(B.lots||[]).reduce((a,l)=>a+(+l.m2||0),0)});
const nextKey=(list,prefix)=>prefix+(list.reduce((m,x)=>Math.max(m,parseInt(String(x.key||"").slice(1))||0),0)+1);

const TOKEN_KEY="gmstone.admin.token";
let token=""; try{ token=localStorage.getItem(TOKEN_KEY)||""; }catch(e){}
async function api(path,opt={}){
  // the login pass goes in X-Admin-Token: Codespaces port forwarding uses the Authorization header itself
  const headers=Object.assign({},opt.headers||{}); if(token) headers["x-admin-token"]=token;
  let r; try{ r=await fetch("/api/"+path,Object.assign({},opt,{headers})); }catch(e){ throw {status:0,error:"No connection"}; }
  let body=null; const ct=r.headers.get("content-type")||""; if(ct.includes("json")) body=await r.json().catch(()=>null); else body=await r.text().catch(()=>null);
  if(!r.ok){ if(r.status===401&&path!=="login") signOut(true); throw Object.assign({status:r.status},typeof body==="object"&&body?body:{error:String(body||r.statusText)}); }
  return body;
}
function signOut(expired){ token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} $("#app").hidden=true; $("#login").hidden=false; $("#loginErr").textContent=expired?"Your session has ended. Sign in again.":""; $("#pw").value=""; $("#pw").focus(); }

/* ============================ state ============================ */
const state={data:null,saved:null,rev:0,updatedAt:null,saving:false}; // saved: a copy of what the server holds
const EMPTY=()=>({DATA:[],STOCK:[],ORDER:[],PROJECTS:[],ENQ_TO:"info@gmstone.ae",WA_NO:"97145768792"});

async function loadData(){
  setSync("busy","Loading…");
  const doc=await api("data");
  state.rev=doc.rev||0; state.updatedAt=doc.updatedAt||null; state.data=doc.data||null; state.saved=state.data?clone(state.data):null;
  setSync(state.data?"ok":"busy",state.data?"Live · rev "+state.rev:"Not set up yet");
  render();
}
/* Save the whole catalogue. Every edit calls this, so the website changes immediately. */
async function commit(what){
  if(state.saving){ toast("Still saving the previous change…",true); return false; }
  state.saving=true; setSync("busy","Saving…");
  try{
    const r=await api("data",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({rev:state.rev,data:state.data,what:what||"Saved"})});
    state.rev=r.rev; state.updatedAt=r.updatedAt; state.saved=clone(state.data); setSync("ok","Live · rev "+state.rev); state.history=null;
    const before=r.rev-1;
    toast((what||"Saved")+" — live",false,before>=1?{label:"Undo",fn:()=>restore(before,"Undone")}:null); render(); return true;
  }catch(e){
    setSync("bad","Not saved");
    // the edit was applied to the screen before saving; undo that, so the screen shows what is really saved
    // (the edit panel stays open with its values, so pressing Save again simply retries)
    if(state.saved) state.data=clone(state.saved);
    if(e.status===409){ toast(e.error,true); await loadData().catch(()=>{}); }
    else toast(e.status===0?"Not saved: no connection. Check the internet and press Save again.":"Not saved: "+(e.error||e.status),true);
    render(); return false;
  }finally{ state.saving=false; }
}
/* Put an earlier saved version back on the site (it becomes a new save, so it can be undone too). */
async function restore(rev,msg){
  if(state.saving){ toast("Still saving the previous change…",true); return false; }
  state.saving=true; setSync("busy","Saving…");
  try{
    const r=await api("restore",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({rev,baseRev:state.rev})});
    const before=r.rev-1;
    state.data=r.data; state.saved=clone(r.data); state.rev=r.rev; state.updatedAt=r.updatedAt; state.history=null; setSync("ok","Live · rev "+state.rev);
    closeDrawer(); toast((msg||"Version put back")+" — live",false,{label:"Undo",fn:()=>restore(before,"Undone")}); render(); return true;
  }catch(e){
    setSync("bad","Not saved");
    if(e.status===409){ toast(e.error,true); await loadData(); }
    else toast("Could not put it back: "+(e.error||e.status),true);
    return false;
  }finally{ state.saving=false; }
}
async function uploadImage(blob){
  const r=await api("upload",{method:"POST",headers:{"content-type":blob.type||"image/jpeg"},body:blob});
  return r.url;
}

/* ============================ first-time setup ============================ */
function parseSiteFile(text){
  const grab=name=>{ let m=text.match(new RegExp("^const "+name+" = \\(window\\.GM_LIVE&&window\\.GM_LIVE\\."+name+"!=null\\?window\\.GM_LIVE\\."+name+":(\\[.*\\])\\);\\s*$","m")); if(!m) m=text.match(new RegExp("^const "+name+" = (\\[.*\\]);\\s*$","m")); return m?JSON.parse(m[1]):null; };
  const d={DATA:grab("DATA"),STOCK:grab("STOCK"),ORDER:grab("ORDER"),PROJECTS:grab("PROJECTS")||[]};
  if(!d.DATA||!d.STOCK||!d.ORDER) return null;
  d.ENQ_TO=(text.match(/"(info@[^"]+)"/)||[])[1]||"info@gmstone.ae";
  d.WA_NO=(text.match(/WA_NO=[^;]*"(\d{8,15})"/)||[])[1]||"97145768792";
  return d;
}
const dataUriToBlob=u=>fetch(u).then(r=>r.blob());
/* Move photos embedded in the data (data:image/…) to uploaded files, so the live data stays small. */
async function migrateEmbedded(d,onStep){
  const jobs=[];
  d.STOCK.forEach(S=>{ if(/^data:/.test(S.img||"")) jobs.push(async()=>{ S.img=await uploadImage(await dataUriToBlob(S.img)); }); (S.gallery||[]).forEach((g,i)=>{ if(/^data:/.test(g||"")) jobs.push(async()=>{ S.gallery[i]=await uploadImage(await dataUriToBlob(g)); }); }); });
  d.ORDER.forEach(O=>{ if(/^data:/.test(O.img||"")) jobs.push(async()=>{ O.img=await uploadImage(await dataUriToBlob(O.img)); }); (O.shots||[]).forEach(s=>{ if(/^data:/.test(s.img||"")) jobs.push(async()=>{ s.img=await uploadImage(await dataUriToBlob(s.img)); }); }); });
  d.PROJECTS.forEach(P=>(P.shots||[]).forEach(s=>{ if(/^data:/.test(s.img||"")) jobs.push(async()=>{ s.img=await uploadImage(await dataUriToBlob(s.img)); }); }));
  d.DATA.forEach(B=>(B.lots||[]).forEach(l=>{ if(/^data:/.test(l.img||"")) jobs.push(async()=>{ l.img=await uploadImage(await dataUriToBlob(l.img)); }); }));
  for(let i=0;i<jobs.length;i++){ onStep&&onStep(i+1,jobs.length); await jobs[i](); }
  return jobs.length;
}
async function setupFromSite(prog){
  prog("Reading the website file…");
  const t=await fetch("/index.html",{cache:"no-store"}).then(r=>r.text());
  const d=parseSiteFile(t); if(!d) throw new Error("Could not read the catalogue data from /index.html");
  const n=await migrateEmbedded(d,(i,nn)=>prog("Moving embedded photo "+i+" of "+nn+"…"));
  state.data=d; prog("Saving…");
  const ok=await commit("Catalogue set up"); if(!ok) throw new Error("save failed");
  return n;
}

async function rHistory(){

  if(!state.history){ v.innerHTML=top+`<div class="empty">Loading the saved versions…</div>`;
    try{ state.history=(await api("history")).items; }catch(e){ v.innerHTML=top+`<div class="notice bad"><p>Could not load the history: ${esc(e.error||e.status)}</p></div>`; return; }
    if(curView!=="history") return; }
  const H=state.history, prev=H.find(h=>h.rev===state.rev-1);
  const when=t=>new Date(t).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  v.innerHTML=top+
    (prev?`<div class="notice"><p><b>Last change:</b> ${esc((H[0]&&H[0].rev===state.rev)?H[0].what:"—")}</p><button class="btn amber" id="undoLast">Undo last change</button></div>`:"")+
    (H.length?`<div class="tblwrap"><table><thead><tr><th>Saved</th><th>What changed</th><th class="r">Version</th><th></th></tr></thead><tbody>
      ${H.map(h=>`<tr><td class="mono" style="white-space:nowrap">${esc(when(h.updatedAt))}</td><td>${esc(h.what)}</td><td class="r num mono">${h.rev}</td><td class="r">${h.rev===state.rev?`<span class="pill ok">Live now</span>`:`<button class="btn sm" data-hv="${h.rev}">Compare &amp; put back</button>`}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">No saves recorded yet. They appear here from the next change.</div>`);
  const u=$("#undoLast"); if(u) u.onclick=()=>restore(prev.rev,"Undone");
  document.querySelectorAll("[data-hv]").forEach(b=>b.onclick=()=>showVersion(+b.dataset.hv));

async function showVersion(rev){
  openDrawer("Version "+rev,"Loading…",`<div class="empty">Loading…</div>`,`<span class="sp"></span><button class="btn ghost" id="cancel">Close</button>`);
  $("#cancel").onclick=closeDrawer;
  let doc; try{ doc=await api("history/"+rev); }catch(e){ $("#dbody").innerHTML=`<div class="notice bad"><p>${esc(e.error||"Could not load it")}</p></div>`; return; }
  const lines=diffData(state.data,doc.data);
  const sm=document.querySelector(".drawer .dh small"); if(sm) sm.textContent="Compared with what is live now";
  $("#dbody").innerHTML=`<p class="hint" style="margin:0">Saved ${esc(new Date(doc.updatedAt).toLocaleString("en-GB"))} · “${esc(doc.what||"Saved")}”</p>`+
    (lines.length?`<div class="panel"><h3>Putting this version back will</h3><ul class="diff">${lines.map(l=>`<li>${l}</li>`).join("")}</ul></div>`:`<div class="notice ok"><p>This version is the same as what is live now.</p></div>`);
  $("#dfoot").innerHTML=`<span class="sp"></span><button class="btn ghost" id="cancel">Close</button><button class="btn amber" id="putBack"${lines.length?"":" disabled"}>Put this version back</button>`;
  $("#cancel").onclick=closeDrawer; $("#putBack").onclick=()=>restore(rev,"Version "+rev+" put back");
}
/* What changes when going from cur (live now) to old (the version being put back), in plain words. */
function diffData(cur,old){
  const out=[], E=s=>esc(s), J=x=>JSON.stringify(x);
  const n=v=>v==null||v===""?"—":String(v);
  const fields={m2:"m²",pcs:"slabs",size:"slab size",name:"name",note:"description",finish:"finish",origin:"origin",cat:"category",price:"special price",special:"special-price flag",hot:"hot flag",grp:"position in list",loc:"location",
    img:"main photo",gallery:"photos",shots:"photos",block:"availability line",sel:"selection",classic:"always-available flag",isnew:"new flag",type:"type",stone:"stone",scope:"scope",reel:"reel",
    material:"material",title:"title",arrived:"arrived / arriving",seq:"book-match flag",lots:"bundles",label:"card size",net:"sizes",id:"bundle number"};
  const what=(a,b)=>{ const ks=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>k!=="hidden"&&k!=="fb"&&J(a[k])!==J(b[k]));
    return ks.map(k=>(k==="m2"||k==="pcs")?`${fields[k]} ${E(n(a[k]))} → ${E(n(b[k]))}`:(fields[k]||k)).filter((x,i,arr)=>x&&arr.indexOf(x)===i).join(", "); };
  const vis=(a,b)=>!!a.hidden!==!!b.hidden?(b.hidden?"hide it from the site":"put it back on the site"):"";
  const coll=(label,A,B,keyOf,nameOf)=>{
    const ma=new Map(A.map(x=>[keyOf(x),x])), mb=new Map(B.map(x=>[keyOf(x),x]));
    const back=B.filter(x=>!ma.has(keyOf(x))).map(nameOf), gone=A.filter(x=>!mb.has(keyOf(x))).map(nameOf);
    if(back.length) out.push(`<b>${label}:</b> bring back ${back.map(E).join(", ")}`);
    if(gone.length) out.push(`<b>${label}:</b> remove ${gone.map(E).join(", ")}`);
    A.forEach(a=>{ const b=mb.get(keyOf(a)); if(!b||J(a)===J(b)) return; const parts=[what(a,b),vis(a,b)].filter(Boolean).join("; "); out.push(`<b>${label}:</b> ${E(nameOf(a))} — ${parts||"small changes"}`); });
  };
  coll("Stock",cur.STOCK,old.STOCK,x=>x.key||x.name,x=>x.name);
  coll("To order",cur.ORDER,old.ORDER,x=>x.key||x.name,x=>x.name);
  coll("Projects",cur.PROJECTS,old.PROJECTS,x=>x.name,x=>x.name);
  // cargo: per block, then per bundle
  const bName=B=>B.title||"Block "+B.block, ka=new Map(cur.DATA.map(B=>[B.block,B])), kb=new Map(old.DATA.map(B=>[B.block,B]));
  const bBack=old.DATA.filter(B=>!ka.has(B.block)).map(bName), bGone=cur.DATA.filter(B=>!kb.has(B.block)).map(bName);
  if(bBack.length) out.push(`<b>Cargo:</b> bring back ${bBack.map(E).join(", ")}`);
  if(bGone.length) out.push(`<b>Cargo:</b> remove ${bGone.map(E).join(", ")}`);
  cur.DATA.forEach(A=>{ const B=kb.get(A.block); if(!B||J(A)===J(B)) return;
    const {lots:la,...ra}=A, {lots:lb,...rb}=B, bits=[];
    const top=[what(ra,rb),vis(ra,rb)].filter(Boolean).join("; "); if(top) bits.push(top);
    const ma=new Map((la||[]).map(l=>[l.id,l])), mb=new Map((lb||[]).map(l=>[l.id,l]));
    (lb||[]).filter(l=>!ma.has(l.id)).forEach(l=>bits.push("bring back bundle "+l.id));
    (la||[]).filter(l=>!mb.has(l.id)).forEach(l=>bits.push("remove bundle "+l.id));
    (la||[]).forEach(l=>{ const m=mb.get(l.id); if(m&&J(l)!==J(m)) bits.push("bundle "+l.id+": "+([what(l,m),vis(l,m)].filter(Boolean).join("; ")||"small changes")); });
    out.push(`<b>Cargo:</b> ${E(bName(A))} — ${bits.map(E).join("; ")||"small changes"}`); });
  if(cur.ENQ_TO!==old.ENQ_TO) out.push(`<b>Contact:</b> enquiry email ${E(cur.ENQ_TO)} → ${E(old.ENQ_TO)}`);
  if(cur.WA_NO!==old.WA_NO) out.push(`<b>Contact:</b> WhatsApp ${E(cur.WA_NO)} → ${E(old.WA_NO)}`);
  return out;
}

// Builds a real .xlsx file in the browser (an .xlsx is a zip of XML files), so no extra service is needed.
function xlsxBlob(sheets){
  const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const col=i=>{ let s=""; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; };
  // styles: 0 normal, 1 header (bold, grey), 2 number 0.00, 3 whole number #,##0, 4 bold, 5 bold 0.00, 6 bold #,##0
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE7E6E1"/></patternFill></fill></fills>
<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
<xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="2" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/>
<xf numFmtId="3" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/></cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
  const sheetXml=sh=>{
    const rows=sh.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>{
      if(c===null||c===undefined||c==="") return "";
      const o=typeof c==="object"?c:{v:c}, ref=col(ci)+(ri+1), st=o.s?` s="${o.s}"`:"";
      return typeof o.v==="number"&&isFinite(o.v)?`<c r="${ref}"${st}><v>${o.v}</v></c>`
        :`<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${esc(o.v)}</t></is></c>`;
    }).join("")+`</row>`).join("");
    const last=col(Math.max(...sh.rows.map(r=>r.length))-1)+sh.rows.length;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
${sh.freeze?`<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`:""}
<cols>${sh.widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>
<sheetData>${rows}</sheetData>${sh.filter?`<autoFilter ref="A1:${col(sh.rows[0].length-1)}${sh.filter}"/>`:""}</worksheet>`;
  };
  const files=[
    ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
    ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>
${sheets.map((sh,i)=>`<sheet name="${esc(sh.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets>
${sheets.some(sh=>sh.filter)?`<definedNames>${sheets.map((sh,i)=>sh.filter?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${esc(sh.name)}'!$A$1:$${col(sh.rows[0].length-1)}$${sh.filter}</definedName>`:"").join("")}</definedNames>`:""}</workbook>`],
    ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ["xl/styles.xml",styles],
    ...sheets.map((sh,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(sh)])];
  // zip, stored (no compression)
  const enc=new TextEncoder(), crcT=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; crcT[n]=c>>>0; }
  const crc=b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=crcT[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const parts=[], dir=[]; let off=0;
  const d=new Date(), dosT=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dosD=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const [name,text] of files){
    const nb=enc.encode(name), data=enc.encode(text), c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dosT,true); h.setUint16(12,dosD,true); h.setUint32(14,c,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true); e.setUint16(4,20,true); e.setUint16(6,20,true); e.setUint16(8,0x0800,true); e.setUint16(10,0,true);
    e.setUint16(12,dosT,true); e.setUint16(14,dosD,true); e.setUint32(16,c,true); e.setUint32(20,data.length,true); e.setUint32(24,data.length,true);
    e.setUint16(28,nb.length,true); e.setUint32(42,off,true);
    dir.push(new Uint8Array(e.buffer),nb);
    off+=30+nb.length+data.length;
  }
  const dirLen=dir.reduce((t,b)=>t+b.length,0), end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,dirLen,true); end.setUint32(16,off,true);
  return new Blob([...parts,...dir,new Uint8Array(end.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function readImport(file){
  const r=new FileReader();
  r.onload=()=>{ let data=null; const t=String(r.result);
    try{ if(/^\s*\{/.test(t)){ const j=JSON.parse(t); if(j.app==="gmstone-admin"&&j.data) data=j.data; } else data=parseSiteFile(t); }catch(e){ data=null; }
    const pv=$("#impPreview"); if(!pv) return;
    if(!data){ pv.innerHTML=`<div class="notice bad"><p>That file is not a GM Stone backup or site file.</p></div>`; return; }
    pv.innerHTML=`<div class="notice"><p><b>Replace the whole catalogue with this file?</b><br>${data.DATA.length} blocks · ${data.STOCK.length} stock items · ${data.ORDER.length} to-order items · ${data.PROJECTS.length} projects.</p><button class="btn amber" id="impGo">Replace</button><button class="btn ghost" id="impNo">Cancel</button></div><div class="prog" id="impProg"></div>`;
    $("#impNo").onclick=()=>pv.innerHTML="";
    $("#impGo").onclick=async()=>{ $("#impGo").disabled=true; try{ await migrateEmbedded(data,(i,n)=>$("#impProg").textContent="Moving embedded photo "+i+" of "+n+"…"); state.data=data; await commit("Catalogue restored"); }catch(e){ toast("Restore failed: "+(e.error||e.message),true); } };
  };
  r.readAsText(file);
}

/* ============================ drawers ============================ */
function openDrawer(title,sub,bodyHtml,footHtml){
  closeDrawer();
  const h=$("#drawerHost");
  h.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-label="${esc(title)}"><div class="dh"><h2>${esc(title)}${sub?`<small>${esc(sub)}</small>`:""}</h2><button class="x" id="dx" aria-label="Close">×</button></div><div class="db" id="dbody">${bodyHtml}</div><div class="df" id="dfoot">${footHtml}</div></aside>`;
  $("#scrim").onclick=closeDrawer; $("#dx").onclick=closeDrawer;
  document.addEventListener("keydown",escClose);

}
function escClose(e){ if(e.key==="Escape") closeDrawer(); }
function closeDrawer(){ $("#drawerHost").innerHTML=""; document.removeEventListener("keydown",escClose); }
const F=(id,label,val,opt={})=>`<div class="field"><label for="f_${id}">${esc(label)}</label>${opt.area?`<textarea id="f_${id}">${esc(val)}</textarea>`:opt.select?`<select id="f_${id}">${opt.select.map(o=>`<option value="${esc(o)}"${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select>`:`<input id="f_${id}" type="${opt.type||"text"}" ${opt.step?`step="${opt.step}"`:""} ${opt.cls?`class="${opt.cls}"`:""} value="${esc(val)}" ${opt.ph?`placeholder="${esc(opt.ph)}"`:""}>`}${opt.hint?`<span class="hint">${opt.hint}</span>`:""}</div>`;
const C=(id,label,val)=>`<label class="check"><input type="checkbox" id="f_${id}"${val?" checked":""}>${esc(label)}</label>`;
const V=id=>{ const e=$("#f_"+id); return e?(e.type==="checkbox"?e.checked:e.value.trim()):""; };
const N=id=>{ const v=parseFloat(V(id)); return isNaN(v)?0:v; };
/* stock quantities: an empty box means "quantity on request" on the site, so it is saved empty, not as 0 */
const NN=id=>{ const s=V(id); if(s==="") return null; const v=parseFloat(s); return isNaN(v)?null:v; };
/* footer: Delete (with an in-page confirm) · Hide from site / Put back on site · Cancel · Save */
function delFoot(label,hideLabel){ return `<span class="confirm" id="conf" hidden>${esc(label||"Delete this item?")} <button class="btn sm bad" id="delYes">Yes, delete</button><button class="btn sm ghost" id="delNo">Keep</button></span><button class="btn bad" id="delBtn">Delete</button>${hideLabel?`<button class="btn ghost" id="hideBtn">${esc(hideLabel)}</button>`:""}<span class="sp"></span><button class="btn ghost" id="cancel">Cancel</button><button class="btn solid" id="saveBtn">Save &amp; publish</button>`; }
const busy=async(id,fn)=>{ const b=$("#"+id); if(b) b.disabled=true; try{ await fn(); }finally{ const bb=$("#"+id); if(bb) bb.disabled=false; } };
function wireFoot(onSave,onDel,onHide){
  $("#cancel").onclick=closeDrawer;
  $("#saveBtn").onclick=()=>busy("saveBtn",onSave);
  const h=$("#hideBtn"); if(h) h.onclick=()=>busy("hideBtn",onHide);

}
const hideNote=x=>x.hidden?`<div class="notice"><p><b>Hidden from the site.</b> Visitors don't see this item. Its details and photos are kept here; press “Put back on site” to show it again.</p></div>`:"";
/* A stock or to-order card without a photo shows an empty picture on the site, so such an item stays hidden
   until it has one. (A project without photos would stop the site's Projects tab from working at all.) */
const noPhotoHide=r=>{ if(!r.img&&!r.hidden){ r.hidden=true; return " — hidden from the site until it has a photo"; } return ""; };
const needPhoto="Add a photo first: an item without a photo can't be shown on the site.";
const withHidden=(r,h)=>{ const o={...r}; if(h) o.hidden=true; else delete o.hidden; return o; };

/* single photo (cargo bundles): Drive link / ID or upload → {img, fb} */
let photoState={};
function photoField(id,img,fb,label){ photoState[id]={img:img||"",fb:fb||""}; return `<div class="field"><label>${esc(label||"Photo")}</label><div class="photo" id="ph_${id}">${photoInner(id)}</div></div>`; }
function photoInner(id){ const p=photoState[id];
  return `<div class="pv">${p.img?IMG(p.img,p.fb):"no photo"}</div><div class="pc"><input id="pl_${id}" placeholder="Paste a Google Drive link or file ID" aria-label="Google Drive link"><div class="row"><button class="btn sm" data-pl="${id}">Use link</button><button class="btn sm" data-pu="${id}">Upload photo</button>${p.img?`<button class="btn sm ghost" data-px="${id}">Remove</button>`:""}</div><span class="hint" id="pm_${id}">${p.img.startsWith("/api/img/")?"Uploaded photo":p.img.startsWith("data:")?"Embedded photo":p.img?"Linked":"Drive links must be shared with “anyone with the link”."}</span></div>`; }
function wirePhotos(){
  document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ const id=b.dataset.pl, p=linkPhoto($("#pl_"+id).value); if(!p) return; photoState[id]=p; $("#ph_"+id).innerHTML=photoInner(id); wirePhotos(); });
  document.querySelectorAll("[data-pu]").forEach(b=>b.onclick=()=>pickImages(false,async blobs=>{ const id=b.dataset.pu; $("#pm_"+id).textContent="Uploading…"; try{ photoState[id]={img:await uploadImage(blobs[0]),fb:""}; $("#ph_"+id).innerHTML=photoInner(id); wirePhotos(); }catch(e){ toast("Upload failed: "+(e.error||e.message),true); $("#pm_"+id).textContent=""; } }));
  document.querySelectorAll("[data-px]").forEach(b=>b.onclick=()=>{ photoState[b.dataset.px]={img:"",fb:""}; $("#ph_"+b.dataset.px).innerHTML=photoInner(b.dataset.px); wirePhotos(); });
}
function linkPhoto(v){ const d=driveId(v); if(d) return {img:driveImg(d),fb:driveFb(d)}; if(/^(https?:\/\/|\/)/.test((v||"").trim())) return {img:v.trim(),fb:""}; toast("Paste a Google Drive link, a file ID or an image URL",true); return null; }
function pickImages(multi,cb){ const i=$("#fileIn"); i.multiple=!!multi; i.onchange=async e=>{ const fs=[...e.target.files]; e.target.value=""; if(!fs.length) return; try{ const out=[]; for(const f of fs) out.push(await compress(f)); cb(out); }catch(err){ toast("Couldn't read that photo. Use a JPEG or PNG; iPhone photos (HEIC) may need to be saved as JPEG first.",true); } }; i.click(); }
/* resize to 1600px max and JPEG-encode so uploads stay small (≈ 150–400 KB) */
function compress(file){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ URL.revokeObjectURL(url); let max=1600,qlt=.86; const step=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>{ if(b&&b.size>450000&&max>800){ max*=.8; qlt-=.06; step(); } else res(b); },"image/jpeg",qlt); }; step(); }; img.onerror=rej; img.src=url; }); }

/* ordered photo list (stock, to order, projects): the FIRST photo is the main one — the photo on the
   card on the site; the rest show when a visitor opens the item, in this order */
const uniqPhotos=list=>{ const seen=new Set(); return list.filter(p=>p&&p.img&&!seen.has(p.img)&&seen.add(p.img)); };
let listState={};
function photoList(id,list,opt){ listState[id]={list:uniqPhotos(list).map(p=>({img:p.img,fb:p.fb||"",rot:p.rot||0})),opt}; return `<div class="field"><label>${esc(opt.label)}</label><span class="hint">${esc(opt.hint)}</span><div id="plw_${id}" class="plist">${listInner(id)}</div></div>`; }
function listInner(id){ const {list,opt}=listState[id], n=list.length;
  return `<div class="pgrid">${list.map((p,i)=>`<div class="pitem${i===0?" main":""}"><div class="pimg">${IMG(p.img,p.fb)}${i===0?`<span class="pmain">${esc(opt.main)}</span>`:`<span class="pno">${i+1}</span>`}</div>
      <div class="pbtns"><button type="button" class="btn sm ghost" data-pm="${id}:${i}:-1" ${i===0?"disabled":""} aria-label="Move earlier" title="Move earlier">◀</button><button type="button" class="btn sm ghost" data-pm="${id}:${i}:1" ${i===n-1?"disabled":""} aria-label="Move later" title="Move later">▶</button>${i>0?`<button type="button" class="btn sm" data-pk="${id}:${i}">Make main</button>`:""}<button type="button" class="btn sm ghost" data-pr="${id}:${i}" aria-label="Remove photo" title="Remove photo">✕</button></div></div>`).join("")||`<div class="empty" style="grid-column:1/-1">No photos yet.</div>`}</div>
    <div class="padd"><input id="pa_${id}" placeholder="Google Drive link or file ID" aria-label="Google Drive link"><button type="button" class="btn sm" data-pa="${id}">Add link</button><button type="button" class="btn sm" data-pu2="${id}">Upload photos</button><span class="prog" id="pp_${id}"></span></div>`; }
function wireList(){
  const redraw=id=>{ $("#plw_"+id).innerHTML=listInner(id); wireList(); };
  document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=()=>{ const [id,i,dir]=b.dataset.pm.split(":"), L=listState[id].list, a=+i, c=a+(+dir); if(c<0||c>=L.length) return; [L[a],L[c]]=[L[c],L[a]]; redraw(id); });
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.pk.split(":"), L=listState[id].list; L.unshift(L.splice(+i,1)[0]); redraw(id); });
  document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.pr.split(":"); listState[id].list.splice(+i,1); redraw(id); });

  document.querySelectorAll("[data-pu2]").forEach(b=>b.onclick=()=>pickImages(true,async blobs=>{ const id=b.dataset.pu2;
    for(let k=0;k<blobs.length;k++){ $("#pp_"+id).textContent=`Uploading ${k+1} of ${blobs.length}…`;
      try{ listState[id].list.push({img:await uploadImage(blobs[k]),fb:"",rot:0}); }catch(e){ toast("Upload failed: "+(e.error||e.message),true); break; } }
    redraw(id); }));
}

/* ---- where stock is held: the site knows exactly two places ----
   loc "Sharjah" shows "Sharjah factory" on the card; anything else shows "Dubai showroom".
   The site's "Where it is held" filter matches "Dubai" and "Sharjah". */
const LOCS=[["Dubai","Dubai showroom"],["Sharjah","Sharjah factory"]];
const isFactory=l=>l==="Sharjah";
const locName=l=>isFactory(l)?"Sharjah factory":"Dubai showroom";
const locSelect=(id,val)=>`<div class="field"><label for="f_${id}">Where it is held</label><select id="f_${id}">${LOCS.map(([v,t])=>`<option value="${v}"${(isFactory(val)?"Sharjah":"Dubai")===v?" selected":""}>${t}</option>`).join("")}</select><span class="hint">Shown on the card on the site, and used by its “Where it is held” filter.</span></div>`;
const range=a=>{ const lo=Math.min(...a), hi=Math.max(...a); return lo===hi?String(lo):lo+"–"+hi; };

/* ---- move cargo into stock (Dubai showroom or Sharjah factory) ----
   The chosen bundles leave Cargo and become (or are added to) a stock item with that location. */
function moveBlock(i){
  const ST=state.data.STOCK, B=state.data.DATA[i]; if(!B) return; const lots=B.lots||[];
  const bName=B.title||"Block "+B.block, parts=(B.material||"").split("·").map(s=>s.trim());
  const name0=(B.title||parts[0]||"").toUpperCase(), finish0=parts.slice(1).join(" · ");
  openDrawer("Move to stock",bName+" · "+(B.material||""),
    `<p class="hint" style="margin:0">The bundles you tick leave Cargo and show in the stock section of the site, labelled with where they are held. Bundle numbers go into the description, so visitors can still search for them. Undo from History if needed.</p>
     <div class="field"><label>Where it went</label><div class="seg" id="mvLoc">${LOCS.map(([v,t],k)=>`<label><input type="radio" name="mvloc" value="${v}"${k===0?" checked":""}> ${t}</label>`).join("")}</div></div>
     <div class="field"><label>Bundles</label><div class="mvlots">${lots.map((l,j)=>`<label class="check"><input type="checkbox" data-mvl="${j}"${l.hidden?"":" checked"}> <span class="mono">${esc(l.id)}</span> · ${l.pcs} slabs · ${fmt(l.m2)} m²${l.img?"":" · no photo"}${l.hidden?` <span class="pill bad">Hidden</span>`:""}</label>`).join("")}</div></div>
     <div class="field"><label for="f_into">Put into</label><select id="f_into"></select></div>
     <div id="mvNew"><div class="grid2">${F("mvname","Name on the site",name0)}${F("mvfinish","Finish",finish0)}</div>${F("mvcat","Category",B.cat||"Travertine",{select:CATS})}</div>
     <div class="notice" id="mvSum"></div>`,
    `<span class="sp"></span><button class="btn ghost" id="cancel">Cancel</button><button class="btn solid" id="mvGo">Move to stock</button>`);
  $("#cancel").onclick=closeDrawer;
  const loc=()=>document.querySelector('input[name="mvloc"]:checked').value;
  const chosen=()=>[...document.querySelectorAll("[data-mvl]")].filter(c=>c.checked).map(c=>lots[+c.dataset.mvl]);
  const fillInto=()=>{ const cur=$("#f_into").value, l=loc();
    const opts=ST.map((s,k)=>({s,k})).filter(({s})=>isFactory(s.loc)===isFactory(l)).sort((a,b)=>((a.s.cat===B.cat)?0:1)-((b.s.cat===B.cat)?0:1)||a.s.name.localeCompare(b.s.name));
    $("#f_into").innerHTML=`<option value="new">A new stock item</option>`+opts.map(({s,k})=>`<option value="${k}">Add to ${esc(s.name)}${s.finish?" · "+esc(s.finish):""} (${fmt(s.m2)} m² now)${s.hidden?" · hidden":""}</option>`).join("");
    if([...$("#f_into").options].some(o=>o.value===cur)) $("#f_into").value=cur; };
  const summary=()=>{ const L=chosen(), net=L.flatMap(l=>l.net||[]), m2=L.reduce((a,l)=>a+(+l.m2||0),0), pcs=L.reduce((a,l)=>a+(+l.pcs||0),0), ph=L.filter(l=>l.img).length;
    $("#mvNew").hidden=$("#f_into").value!=="new";
    const where=locName(loc()), into=$("#f_into").value==="new"?"a new stock item":ST[+$("#f_into").value].name;
    $("#mvSum").innerHTML=L.length?`<p><b>${L.length} bundle${L.length===1?"":"s"} · ${pcs} slabs · ${fmt(m2)} m²</b> → ${esc(into)}, ${esc(where)}.${net.length?` Slab sizes ${range(net.map(n=>n[1]))} × ${range(net.map(n=>n[0]))} cm.`:""} ${ph} photo${ph===1?"":"s"}.${!ph&&$("#f_into").value==="new"?" <br>With no photo it is saved <b>hidden from the site</b>; add a photo, then put it back on site.":""}${L.length===lots.length?" The block leaves Cargo.":""}</p>`:`<p>Tick at least one bundle.</p>`; };
  document.querySelectorAll('input[name="mvloc"]').forEach(r=>r.onchange=()=>{ fillInto(); summary(); });
  document.querySelectorAll("[data-mvl]").forEach(c=>c.onchange=summary); $("#f_into").onchange=summary;
  fillInto(); summary();
  $("#mvGo").onclick=()=>busy("mvGo",async()=>{
    const STn=state.data.STOCK, Bn=state.data.DATA[i]; if(!Bn){ toast("This block has changed. Close the panel and open it again.",true); return; }
    const picked=new Set([...document.querySelectorAll("[data-mvl]")].filter(c=>c.checked).map(c=>+c.dataset.mvl)), L=(Bn.lots||[]).filter((x,j)=>picked.has(j)); if(!L.length){ toast("Tick at least one bundle",true); return; }
    const l=loc(), net=L.flatMap(x=>x.net||[]), m2=Math.round(L.reduce((a,x)=>a+(+x.m2||0),0)*100)/100, pcs=L.reduce((a,x)=>a+(+x.pcs||0),0), ids=L.map(x=>x.id);
    const photos=uniqPhotos(L.filter(x=>x.img).map(x=>({img:x.img,fb:x.fb||""})));
    const from=`${ids.length===1?"Bundle":"Bundles"} ${ids.join(", ")} from block ${B.block}`+(B.seq?" — cut in sequence, can be book-matched":"")+".";
    const into=$("#f_into").value; let what;
    if(into==="new"){
      const name=V("mvname"); if(!name){ toast("Give the stock item a name",true); return; }
      const r={name,m2,pcs,size:net.length?`${range(net.map(n=>n[1]))} × ${range(net.map(n=>n[0]))} cm`:"",note:from,img:photos[0]?photos[0].img:"",origin:null,finish:V("mvfinish")||null,
        gallery:photos.length>1?photos.map(p=>p.img):null,cat:V("mvcat"),key:nextKey(STn,"s"),grp:3,loc:l,special:false};
      if(photos[0]&&photos[0].fb) r.fb=photos[0].fb; if(B.hot) r.hot=true; if(!photos.length) r.hidden=true;
      STn.push(r); what=`Moved ${ids.length} bundle${ids.length===1?"":"s"} of ${bName} to ${locName(l)}: new stock item ${name}${r.hidden?" (hidden until it has a photo)":""}`;
    }else{
      const S=STn[+into], list=uniqPhotos([{img:S.img,fb:S.fb},...(S.gallery||[]).map(g=>({img:g})),...photos]);
      S.m2=Math.round(((+S.m2||0)+m2)*100)/100; S.pcs=(+S.pcs||0)+pcs; S.note=((S.note||"")+" + "+from).trim().replace(/^\+ /,"");
      if(list.length){ S.img=list[0].img; if(list[0].fb) S.fb=list[0].fb; S.gallery=list.length>1?list.map(p=>p.img):null; }
      what=`Moved ${ids.length} bundle${ids.length===1?"":"s"} of ${bName} to ${locName(l)}: added to ${S.name}`;
    }
    const keep=(Bn.lots||[]).filter((x,j)=>!picked.has(j)); if(keep.length) Bn.lots=keep; else state.data.DATA.splice(i,1);
    if(await commit(what)) closeDrawer();
  });
}

/* ---- block ---- */
function editBlock(i){
  const D=state.data.DATA, isNew=i<0;
  const B=isNew?{block:"",material:"",cat:"Marble",arrived:false,new:true,lots:[]}:clone(D[i]);
  openDrawer(isNew?"New block":"Edit block",isNew?"Add bundles after saving":(B.lots||[]).length+" bundle"+((B.lots||[]).length===1?"":"s")+" · edit bundles from the cargo list",
    hideNote(B)+`<div class="grid2">${F("block","Block number",B.block,{cls:"mono",ph:"e.g. 4573"})}${F("cat","Category",B.cat,{select:CATS})}</div>
     ${F("material","Material · finish",B.material,{ph:"e.g. White Travertine · Raw"})}
     ${F("title","Display title (optional)",B.title||"",{hint:"Shown instead of “Block 4573”. Start with “Container” to count it as a container on the site."})}
     <div class="checks">${C("arrived","Arrived · in stock",B.arrived)}${C("hot","★ Hot",B.hot)}${C("seq","Cut in sequence (book-match)",B.seq)}</div>`,
    delFoot("Delete this block and all its bundles?",isNew?"":B.hidden?"Put back on site":"Hide block"));
  const build=()=>{ const r={...B,block:V("block"),cat:V("cat"),material:V("material"),arrived:V("arrived")}; const t=V("title"); if(t) r.title=t; else delete r.title; if(V("hot")) r.hot=true; else delete r.hot; if(V("seq")) r.seq=true; else delete r.seq;
    if(!r.block&&!r.title){ toast("Give the block a number or a title",true); return null; } return r; };
  wireFoot(async()=>{ const r=build(); if(!r) return; if(isNew) state.data.DATA.push(r); else state.data.DATA[i]=r; if(await commit((isNew?"Added ":"Updated ")+(r.title||"Block "+r.block))) closeDrawer(); },
    isNew?null:async()=>{ state.data.DATA.splice(i,1); if(await commit("Deleted "+(B.title||"Block "+B.block))) closeDrawer(); },
    async()=>{ const r=build(); if(!r) return; state.data.DATA[i]=withHidden(r,!B.hidden); if(await commit((B.hidden?"Put back on site: ":"Hidden from site: ")+(r.title||"Block "+r.block))) closeDrawer(); });
}
/* ---- bundle (lot) ---- */
function editLot(bi,li){
  const B=state.data.DATA[bi]; if(!B) return; B.lots=B.lots||[]; const isNew=li<0;
  const L=isNew?{id:B.block+"/"+(B.lots.length+1),pcs:0,m2:0,net:[[0,0,0]]}:clone(B.lots[li]); L.net=L.net&&L.net.length?L.net:[[0,0,0]];
  const sizeRows=()=>L.net.map((n,i)=>`<div class="srow"><input type="number" class="num" data-n="${i}:0" value="${n[0]||""}" placeholder="Width" aria-label="Width cm"><input type="number" class="num" data-n="${i}:1" value="${n[1]||""}" placeholder="Length" aria-label="Length cm"><input type="number" class="num" data-n="${i}:2" value="${n[2]||""}" placeholder="Pcs" aria-label="Pieces"><button class="x" data-nx="${i}" aria-label="Remove size">×</button></div>`).join("");
  openDrawer(isNew?"New bundle":"Edit bundle",(B.title||"Block "+B.block)+" · "+B.material,
    (B.hidden?`<div class="notice"><p>The whole block is hidden from the site, so this bundle is hidden too.</p></div>`:hideNote(L))+
    `<div class="grid3">${F("lid","Bundle no.",L.id,{cls:"mono"})}${F("pcs","Slabs",L.pcs,{type:"number"})}${F("m2","m²",L.m2,{type:"number",step:"0.01"})}</div>
     <div class="field"><label>Net slab sizes · width × length cm × pieces</label><div class="sizes" id="sizes">${sizeRows()}</div><div class="bar" style="margin-top:6px"><button class="btn sm" id="addSize">+ Size</button><button class="btn sm ghost" id="calc">Calculate m² and slabs from sizes</button></div></div>
     ${F("label","Sawn size on the card (optional)",L.label||"",{hint:"Shown under the sizes, e.g. “2 × 132 × 243 · 12 pcs”."})}
     ${photoField("lot",L.img,L.fb,"Bundle photo")}`,
    delFoot("Remove this bundle from the block?",isNew?"":L.hidden?"Put back on site":"Hide bundle"));
  wirePhotos();
  const readNet=()=>{ const rows={}; document.querySelectorAll("[data-n]").forEach(i=>{ const [r,c]=i.dataset.n.split(":"); (rows[r]=rows[r]||[0,0,0])[+c]=parseFloat(i.value)||0; }); return Object.values(rows).filter(n=>n[0]||n[1]||n[2]); };
  const rewire=()=>{ document.querySelectorAll("[data-nx]").forEach(b=>b.onclick=()=>{ L.net=readNet(); L.net.splice(+b.dataset.nx,1); if(!L.net.length) L.net=[[0,0,0]]; $("#sizes").innerHTML=sizeRows(); rewire(); }); };
  rewire();
  $("#addSize").onclick=()=>{ L.net=readNet(); L.net.push([0,0,0]); $("#sizes").innerHTML=sizeRows(); rewire(); };
  $("#calc").onclick=()=>{ const net=readNet(); $("#f_pcs").value=net.reduce((a,n)=>a+n[2],0); $("#f_m2").value=(net.reduce((a,n)=>a+n[0]*n[1]*n[2],0)/10000).toFixed(2); };
  const build=()=>{ const r={id:V("lid"),pcs:N("pcs"),m2:N("m2"),net:readNet()}; if(photoState.lot.img){ r.img=photoState.lot.img; if(photoState.lot.fb) r.fb=photoState.lot.fb; } const lb=V("label"); if(lb) r.label=lb; if(L.hidden) r.hidden=true;
    if(!r.id){ toast("Give the bundle a number",true); return null; } return r; };
  wireFoot(async()=>{ const r=build(); if(!r) return; if(isNew) state.data.DATA[bi].lots.push(r); else state.data.DATA[bi].lots[li]=r; if(await commit((isNew?"Added bundle ":"Updated bundle ")+r.id)) closeDrawer(); },
    isNew?null:async()=>{ state.data.DATA[bi].lots.splice(li,1); if(await commit("Removed bundle "+L.id)) closeDrawer(); },
    async()=>{ const r=build(); if(!r) return; state.data.DATA[bi].lots[li]=withHidden(r,!L.hidden); if(await commit((L.hidden?"Put back on site: bundle ":"Hidden from site: bundle ")+r.id)) closeDrawer(); });
}
/* ---- stock ---- */
function editStock(i){
  const ST=state.data.STOCK, isNew=i<0;
  const S=isNew?{name:"",m2:0,pcs:0,size:"",note:"",img:"",origin:null,finish:"Polished",gallery:null,cat:"Marble",key:nextKey(ST,"s"),grp:3,loc:"Dubai",special:false}:clone(ST[i]);
  // the card photo (img) first, then the gallery; on the site the gallery is what opens when the photo is clicked
  const photos=[{img:S.img,fb:S.fb},...(S.gallery||[]).map(g=>({img:g}))];
  openDrawer(isNew?"New stock item":"Edit stock item",isNew?"":S.name,
    hideNote(S)+`${F("name","Material name",S.name,{ph:"e.g. CALACATTA VIOLA"})}
     <div class="grid2">${F("cat","Category",S.cat,{select:CATS})}${F("finish","Finish",S.finish||"",{ph:"Polished · bookmatched"})}</div>
     <p class="hint" style="margin:0">Leave m² or slabs empty when the quantity is on request: the site then shows “Ask · quantity on request”.</p>
     <div class="grid3">${F("m2","m² available",S.m2,{type:"number",step:"0.01",ph:"on request"})}${F("pcs","Slabs",S.pcs,{type:"number",ph:"—"})}${F("size","Slab size",S.size||"",{ph:"302 × 200 cm"})}</div>
     ${F("note","Description",S.note||"",{area:true})}
     <div class="grid2">${F("origin","Origin",S.origin||"",{ph:"Italy"})}${locSelect("loc",S.loc)}</div>
     <div class="grid2">${F("grp","Position in list",["1","2","3"].includes(String(S.grp))?String(S.grp):"3",{select:["1","2","3"],hint:"1 shows first, 3 last within its category."})}${F("price","Special price · AED per m² (optional)",S.price||"",{cls:"mono"})}</div>
     <div class="checks">${C("special","Special price",S.special)}${C("hot","★ Hot · featured",S.hot)}</div>
     ${photoList("st",photos,{label:"Photos",main:"Card photo",hint:"The first photo is on the card. Clicking it on the site shows all of them in this order."})}`,
    delFoot("Delete this material for good? To take it off the site but keep it, use “Hide from site”.",isNew?"":S.hidden?"Put back on site":"Hide from site"));
  wireList();
  const build=()=>{ const r={...S,name:V("name"),cat:V("cat"),finish:V("finish")||null,m2:NN("m2"),pcs:NN("pcs"),size:V("size"),note:V("note"),origin:V("origin")||null,loc:V("loc")||"Dubai",grp:+V("grp")||3,special:V("special")};
    const L=listState.st.list; r.img=L[0]?L[0].img:""; if(L[0]&&L[0].fb) r.fb=L[0].fb; else delete r.fb; r.gallery=L.length>1?L.map(p=>p.img):null;
    const pr=V("price"); if(pr) r.price=pr; else delete r.price; if(V("hot")) r.hot=true; else delete r.hot;
    if(!r.name){ toast("Give the material a name",true); return null; } return r; };
  wireFoot(async()=>{ const r=build(); if(!r) return; const n=noPhotoHide(r); if(isNew) state.data.STOCK.push(r); else state.data.STOCK[i]=r; if(await commit((isNew?"Added ":"Updated ")+r.name+n)) closeDrawer(); },
    isNew?null:async()=>{ state.data.STOCK.splice(i,1); if(await commit("Deleted from stock: "+S.name)) closeDrawer(); },
    async()=>{ const r=build(); if(!r) return; if(S.hidden&&!r.img){ toast(needPhoto,true); return; } state.data.STOCK[i]=withHidden(r,!S.hidden); if(await commit((S.hidden?"Put back on site: ":"Hidden from site: ")+r.name)) closeDrawer(); });
}
/* ---- order ---- */
function editOrder(i){
  const OR=state.data.ORDER, isNew=i<0;
  const O=isNew?{name:"",block:"brought in to order",cat:"Marble",img:"",fb:null,key:nextKey(OR,"o"),note:"",isnew:true}:clone(OR[i]);
  const photos=[{img:O.img,fb:O.fb},...(O.shots||[])];
  openDrawer(isNew?"New to-order item":"Edit to-order item",isNew?"":O.name,
    hideNote(O)+`${F("name","Material name",O.name)}
     <div class="grid2">${F("cat","Category",O.cat,{select:CATS})}${F("sel","Selection label (optional)",O.sel||"",{ph:"Selection 1"})}</div>
     ${F("block","Block / availability line",O.block||"",{hint:"Shown under the name, e.g. “brought in to order” or “Selection 1 — block ref on request”."})}
     ${F("note","Description",O.note||"",{area:true})}
     <div class="checks">${C("classic","Always available (classic)",O.classic)}${C("isnew","New selection",O.isnew)}</div>
     ${photoList("or",photos,{label:"Photos",main:"Card photo",hint:"The first photo is on the card. When a visitor opens the item, all of them show in this order."})}`,
    delFoot("Delete this item for good? To take it off the site but keep it, use “Hide from site”.",isNew?"":O.hidden?"Put back on site":"Hide from site"));
  wireList();
  const build=()=>{ const r={...O,name:V("name"),cat:V("cat"),block:V("block")||"brought in to order",note:V("note")};
    const L=listState.or.list; r.img=L[0]?L[0].img:""; r.fb=L[0]&&L[0].fb?L[0].fb:null; if(L.length>1) r.shots=L.map(p=>({img:p.img,fb:p.fb||null})); else delete r.shots;
    const sel=V("sel"); if(sel) r.sel=sel; else delete r.sel; if(V("classic")) r.classic=true; else delete r.classic; if(V("isnew")) r.isnew=true; else delete r.isnew;
    if(!r.name){ toast("Give the material a name",true); return null; } return r; };
  wireFoot(async()=>{ const r=build(); if(!r) return; const n=noPhotoHide(r); if(isNew) state.data.ORDER.push(r); else state.data.ORDER[i]=r; if(await commit((isNew?"Added ":"Updated ")+r.name+n)) closeDrawer(); },
    isNew?null:async()=>{ state.data.ORDER.splice(i,1); if(await commit("Deleted to-order item: "+O.name)) closeDrawer(); },
    async()=>{ const r=build(); if(!r) return; if(O.hidden&&!r.img){ toast(needPhoto,true); return; } state.data.ORDER[i]=withHidden(r,!O.hidden); if(await commit((O.hidden?"Put back on site: ":"Hidden from site: ")+r.name)) closeDrawer(); });
}
/* ---- project ---- */
function editProject(i){
  const PR=state.data.PROJECTS, isNew=i<0, pin=!isNew&&pinned(i);
  const P=isNew?{name:"",loc:"",type:"Private villa",stone:"",shots:[],scope:"Supply & installation"}:clone(PR[i]);
  openDrawer(isNew?"New project":"Edit project",isNew?"":P.name,
    hideNote(P)+(pin?`<div class="notice"><p><b>${state.pins&&state.pins.has(i)?"This project has a pin on the site's map.":"Projects up to this one are linked to pins on the site's map."}</b> Pins open projects by their place in the list, so this project can't be hidden or deleted: the pins would open the wrong projects. Everything else can be changed.</p></div>`:"")+
    `${F("name","Project name",P.name,{ph:"Dubai Hills Villa"})}
     <div class="grid2">${F("loc","Location",P.loc||"",{ph:"Dubai Hills Estate, Dubai"})}${F("type","Type",P.type||"")}</div>
     ${F("stone","Stone used",P.stone||"",{area:true})}
     <div class="grid2">${F("scope","Scope",P.scope||"")}${F("reel","Instagram reel code (optional)",P.reel||"",{cls:"mono",hint:"The part after instagram.com/reel/"})}</div>
     ${photoList("prs",P.shots||[],{label:"Photos",main:"Cover",hint:"The first photo is the cover on the Projects tab. Opening the project shows all of them in this order."})}`,
    delFoot("Delete this project?",isNew||pin?"":P.hidden?"Put back on site":"Hide from site"));
  wireList();
  const build=()=>{ const r={...P,name:V("name"),loc:V("loc"),type:V("type"),stone:V("stone"),scope:V("scope"),shots:listState.prs.list.map(s=>{ const x={img:s.img,fb:s.fb||null}; if(s.rot) x.rot=s.rot; return x; })};
    const reel=V("reel").replace(/^.*\/reel\//,"").replace(/\/.*$/,""); if(reel) r.reel=reel; else delete r.reel;
    if(!r.name){ toast("Give the project a name",true); return null; }
    if(!r.shots.length&&!r.hidden){ toast("Add at least one photo: a project without photos can't be shown on the site.",true); return null; } return r; };
  wireFoot(async()=>{ const r=build(); if(!r) return; if(isNew) state.data.PROJECTS.push(r); else state.data.PROJECTS[i]=r; if(await commit((isNew?"Added project ":"Updated project ")+r.name)) closeDrawer(); },
    isNew||pin?null:async()=>{ if(pinned(i)) return; state.data.PROJECTS.splice(i,1); if(await commit("Deleted project "+P.name)) closeDrawer(); },
    async()=>{ if(pinned(i)) return; const r=build(); if(!r) return; if(P.hidden&&!r.shots.length){ toast(needPhoto,true); return; } state.data.PROJECTS[i]=withHidden(r,!P.hidden); if(await commit((P.hidden?"Put back on site: ":"Hidden from site: ")+r.name)) closeDrawer(); });
}

/* ============================ boot ============================ */
$("#loginForm").onsubmit=async e=>{
  e.preventDefault(); const b=$("#loginBtn"); b.disabled=true; $("#loginErr").textContent="";
  try{ const r=await api("login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:$("#pw").value})}); token=r.token; try{ localStorage.setItem(TOKEN_KEY,token); }catch(x){} await enter(); }
  catch(err){ $("#loginErr").textContent=err.error||"Could not sign in"; }
  finally{ b.disabled=false; }
};
$("#signout").onclick=()=>signOut(false);
async function enter(){ $("#login").hidden=true; $("#app").hidden=false; route(); try{ await Promise.all([loadData(),loadPins()]); render(); }catch(e){ if(e.status!==401){ setSync("bad","Could not load"); toast("Could not load the catalogue: "+(e.error||e.status),true); } } }
(async()=>{
  if(token){ try{ await api("me"); await enter(); return; }catch(e){ token=""; try{ localStorage.removeItem(TOKEN_KEY); }catch(x){} } }
  $("#login").hidden=false; $("#pw").focus();
  try{ const s=await api("status"); if(!s.configured) $("#loginErr").textContent="The admin password hasn't been set up yet. In Netlify: Project configuration > Environment variables > ADMIN_PASSWORD, then deploy again."; }catch(e){}
})();
</script>
