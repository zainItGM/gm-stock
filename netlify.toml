[build]
  publish = "site"
  functions = "netlify/functions"

# @netlify/blobs needs Node 22 or newer (same as the mosaic site)
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Photos in /img/ are named after their content, so a changed photo always gets a new name.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
